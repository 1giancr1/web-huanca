<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Señor de Huanca Espinar S.A.C. | Plataforma en Línea</title>

  <!-- Ícono del logo en la pestaña del navegador y pantalla de inicio del celular -->
  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-[#f4f7f7] text-[#082022] min-h-screen flex flex-col justify-between items-center px-4 py-8 selection:bg-[#082022] selection:text-white">

  <!-- Contenedor principal centrado -->
  <div class="w-full max-w-md my-auto space-y-7">

    <!-- 1. Encabezado Institucional con Imagen de Logo -->
    <header class="text-center space-y-3.5">
      <div class="w-32 h-32 mx-auto rounded-3xl overflow-hidden bg-[#082022] border-2 border-[#c5b496]/60 shadow-2xl shadow-[#082022]/20 flex items-center justify-center p-1.5">
        <!-- Carga directa de tu archivo logo.png -->
        <img id="imgLogoPrincipal"
             src="./logo.png"
             alt="Logo Transportes Señor de Huanca Espinar S.A.C."
             onerror="this.style.display='none'; document.getElementById('logoFallbackSvg').classList.remove('hidden');"
             class="w-full h-full object-contain rounded-2xl" />

        <!-- Emblema gráfico de respaldo si logo.png aún no está en la misma carpeta -->
        <svg id="logoFallbackSvg" class="hidden w-full h-full" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <rect width="200" height="200" rx="28" fill="#082022" />
          <rect x="10" y="10" width="180" height="180" rx="22" fill="none" stroke="#c5b496" stroke-width="2" stroke-opacity="0.55" />
          <!-- Silueta de montañas andinas -->
          <path d="M35 108 L72 62 L98 92 L126 54 L165 108 Z" fill="none" stroke="#c5b496" stroke-width="3" stroke-linejoin="round" />
          <path d="M62 74 L72 62 L82 74 M115 68 L126 54 L137 68" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="32" y1="114" x2="168" y2="114" stroke="#c5b496" stroke-width="1.5" stroke-opacity="0.6" />
          <text x="100" y="42" text-anchor="middle" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="3">TAXI SERVICE</text>
          <text x="100" y="136" text-anchor="middle" fill="#c5b496" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" letter-spacing="1">SR. DE HUANCA</text>
          <text x="100" y="154" text-anchor="middle" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.5">ESPINAR • CUSCO</text>
        </svg>
      </div>

      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-[#082022]">
          Señor de Huanca Espinar S.A.C.
        </h1>
        <p class="text-xs text-slate-500 font-medium mt-1">
          Gestión de flota • Facturación electrónica • SUNAT Central
        </p>
      </div>
    </header>

    <!-- 2. Opciones Principales: Cliente y Conductor -->
    <main class="space-y-4">

      <!-- Opción 1: Portal del Pasajero -->
      <a href="./qr.html"
         class="group block w-full rounded-3xl bg-[#082022] hover:bg-[#0e3336] active:scale-[0.99] p-6 shadow-xl shadow-[#082022]/20 border border-[#194347] transition-all duration-200">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-white/10 border border-[#c5b496]/30 flex items-center justify-center shrink-0 text-[#c5b496]">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div class="text-left">
              <h2 class="text-lg font-extrabold text-white leading-tight">
                Portal del Pasajero
              </h2>
              <p class="text-xs font-medium text-slate-300 mt-1">
                Solicitar factura y programar retorno
              </p>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full bg-white/10 group-hover:translate-x-0.5 flex items-center justify-center text-[#c5b496] font-bold transition-transform shrink-0">
            →
          </div>
        </div>
      </a>

      <!-- Opción 2: Portal del Conductor -->
      <a href="./chofer.html"
         class="group block w-full rounded-3xl bg-white hover:bg-[#f8fafa] active:scale-[0.99] p-6 shadow-lg shadow-slate-200/70 border-2 border-[#082022]/20 hover:border-[#082022] transition-all duration-200">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-[#082022]/8 border border-[#082022]/15 flex items-center justify-center shrink-0 text-[#082022]">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h8m-8 5h8m-4 5v-5m-7 8h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <div class="text-left">
              <h2 class="text-lg font-extrabold text-[#082022] leading-tight">
                Portal del Conductor
              </h2>
              <p class="text-xs font-medium text-slate-500 mt-1">
                Facturas, turno y comprobantes
              </p>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full bg-[#082022]/8 group-hover:bg-[#082022] group-hover:text-white group-hover:translate-x-0.5 flex items-center justify-center text-[#082022] font-bold transition-all shrink-0">
            →
          </div>
        </div>
      </a>

    </main>
  </div>

  <!-- 3. Pie de Pantalla: Acceso Discreto de Administración -->
  <footer class="w-full max-w-md pt-6 pb-2 text-center">
    <a href="./gerencia.html"
       class="inline-block text-[11px] font-semibold text-slate-400 hover:text-[#082022] transition-colors">
      ¿Eres administrador? Ingresar a Gerencia
    </a>
  </footer>

</body>
</html>
