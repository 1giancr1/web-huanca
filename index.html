<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Señor de Huanca Espinar S.A.C. | Plataforma en Línea</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-[#f4f7f7] text-[#082022] min-h-screen flex flex-col justify-between items-center px-4 py-8 selection:bg-[#082022] selection:text-white">

  <!-- Contenedor principal centrado -->
  <div class="w-full max-w-md my-auto space-y-7">

    <!-- 1. Encabezado Institucional con Logo -->
    <header class="bg-[#082022] text-white rounded-3xl p-6 text-center shadow-xl shadow-[#082022]/15 border border-[#163a3d] space-y-3">
      <div class="w-24 h-24 mx-auto rounded-2xl overflow-hidden bg-[#082022] border border-[#c5b496]/35 shadow-md flex items-center justify-center">
        <img src="./logo.png" alt="Logo Transportes Sr. de Huanca"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
             class="w-full h-full object-contain" />
        <div style="display:none" class="w-full h-full flex-col items-center justify-center px-2 text-center">
          <span class="text-[8px] tracking-[0.2em] text-white/90 font-semibold">TAXI SERVICE</span>
          <span class="text-[9px] text-white/80 mt-0.5">Transportes</span>
          <span class="text-[11px] font-extrabold tracking-wide text-[#c5b496] leading-tight mt-0.5">SR. DE HUANCA</span>
        </div>
      </div>

      <div class="space-y-1">
        <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white">
          Señor de Huanca Espinar S.A.C.
        </h1>
        <p class="text-xs text-[#c5b496] font-medium">
          Gestión de flota • Facturación electrónica • SUNAT Central
        </p>
      </div>
    </header>

    <!-- 2. Bloque Central: Solo 2 Opciones Principales Claramente Diferenciadas -->
    <main class="space-y-3.5">

      <!-- Opción 1: Portal del Pasajero (Tarjeta Verde Bosque Principal) -->
      <a href="./qr.html"
         class="group block w-full rounded-3xl bg-[#082022] hover:bg-[#0e3235] active:scale-[0.99] p-5 shadow-lg shadow-[#082022]/15 border border-[#194347] transition-all duration-200">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-white/10 border border-[#c5b496]/30 flex items-center justify-center shrink-0 text-[#c5b496]">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div class="text-left">
              <h2 class="text-base sm:text-lg font-extrabold text-white leading-tight">
                Portal del Pasajero
              </h2>
              <p class="text-xs font-medium text-[#c5b496] mt-0.5">
                Solicitar factura y retorno
              </p>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full bg-white/10 group-hover:bg-[#c5b496] group-hover:text-[#082022] group-hover:translate-x-0.5 flex items-center justify-center text-white font-bold transition-all shrink-0">
            →
          </div>
        </div>
      </a>

      <!-- Opción 2: Portal del Conductor (Tarjeta Blanca Ejecutiva) -->
      <a href="./chofer.html"
         class="group block w-full rounded-3xl bg-white hover:bg-[#f9fbfb] active:scale-[0.99] p-5 shadow-md shadow-slate-200/70 border-2 border-[#082022]/15 hover:border-[#082022] transition-all duration-200">
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-[#082022]/8 border border-[#082022]/15 flex items-center justify-center shrink-0 text-[#082022]">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h8m-8 5h8m-4 5v-5m-7 8h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <div class="text-left">
              <h2 class="text-base sm:text-lg font-extrabold text-[#082022] leading-tight">
                Portal del Conductor
              </h2>
              <p class="text-xs font-medium text-slate-500 mt-0.5">
                Facturas y gestión
              </p>
            </div>
          </div>
          <div class="w-9 h-9 rounded-full bg-[#082022]/8 group-hover:bg-[#082022] group-hover:text-white group-hover:translate-x-0.5 flex items-center justify-center text-[#082022] font-bold transition-all shrink-0">
            →
          </div>
        </div>
      </a>

    </main>

  </div>

  <!-- 3. Pie de Pantalla: Acceso Discreto de Administración -->
  <footer class="w-full max-w-md pt-6 pb-2 text-center">
    <a href="./gerencia.html"
       class="inline-block text-[11px] font-medium text-slate-400 hover:text-[#082022] transition-colors">
      ¿Eres administrador?
    </a>
  </footer>

</body>
</html>
